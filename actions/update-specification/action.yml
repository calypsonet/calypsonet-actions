name: Update documentation branch
description: Generate and push Specification to the `doc` branch

inputs:
  repo-name:
    description: Repo name
    required: true
  spec-version:
    description: Spec version
    required: true
  spec-full-name:
    description: Spec full name (HTML and PDF)
    required: true
  github-bot-token:
    description: GitHub bot token (used for authentication)
    required: true

runs:
  using: "composite"
  steps:

    - name: Show Action Version
      shell: bash
      run: |
        echo "::group::Action Version Info"
        echo "Using calypsonet-actions version: ${{ env.GITHUB_ACTION_REF }}"
        echo "SHA: ${{ github.sha }}"
        echo "Action path: ${{ github.action_path }}"
        echo "::endgroup::"

    - name: Run prepare_specification.sh
      shell: bash
      run: |
        SCRIPT="${{ github.action_path }}/scripts/prepare_specification.sh"

        # In container jobs, GitHub can expose the action under /home/runner/work/_actions
        # while the mounted workspace path is /__w/_actions.
        if [ ! -f "$SCRIPT" ] && [[ "$SCRIPT" == /home/runner/work/_actions/* ]]; then
          SCRIPT="/__w/_actions/${SCRIPT#/home/runner/work/_actions/}"
        fi

        if [ ! -f "$SCRIPT" ]; then
          echo "::error::prepare_specification.sh not found."
          echo "::error::Tried: ${{ github.action_path }}/scripts/prepare_specification.sh"
          echo "::error::Tried: $SCRIPT"
          exit 1
        fi

        bash "$SCRIPT" \
          "${{ inputs.repo-name }}" \
          "${{ inputs.spec-version }}" \
          "${{ inputs.spec-full-name }}"

    - name: Commit and push Specification to doc branch
      shell: bash
      working-directory: ${{ inputs.repo-name }}
      run: |
        git add -A
        git config user.email "${{ inputs.repo-name }}-bot@calypsonet.org"
        git config user.name "${{ inputs.repo-name }}-bot"
        git commit --allow-empty -m "docs: update documentation $GITHUB_WORKFLOW-$GITHUB_RUN_NUMBER"
        git log --graph --abbrev-commit --date=relative -n 5
        git push "https://${{ inputs.github-bot-token }}@github.com/calypsonet/${{ inputs.repo-name }}.git" HEAD:doc

    - name: Trigger central documentation update
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ inputs.github-bot-token }}
        repository: calypsonet/calypsonet-terminal-api-docs
        event-type: update-submodules
